<!doctype html>
<html lang="ru">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Together Till Infinity</title>
<style>
@font-face{font-family:'Comfortaa';font-weight:700;src:url(fonts/comfortaa-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Comfortaa';font-weight:700;src:url(fonts/comfortaa-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Nunito';font-weight:800;src:url(fonts/nunito-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-weight:800;src:url(fonts/nunito-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0}
body{background:#0f0b1c;color:#efe6ff;font-family:'Nunito',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 20px 48px;gap:22px}
h1{font-family:'Comfortaa';font-weight:700;font-size:clamp(22px,3vw,34px);letter-spacing:.5px}
.frame{width:min(1280px,100%);aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #000a,0 0 0 1px #ffffff14;cursor:pointer}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<h1>Together Till Infinity</h1>
<div class="frame" id="frame"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1920,H=1080;

// строки караоке: слоги через |, длительность слога в секундах после :
const LYRICS=[
  'сквозь:.42| ты:.30|ся:.30|чу:.36| звёзд:.9',
  'я:.3| и:.28|ду:.36| за:.3| то:.34|бой:1.0',
  'и:.28| даль:.38|ше,:.4| чем:.3| свет:.95',
  'вме:.32|сте:.32| до:.34| бес:.3|ко:.3|неч:.34|нос:.3|ти:1.3',
];
const KFONT='700 66px Comfortaa';
const ROWS=[{x:96,y:735},{x:216,y:845}];
const INTRO=2.6, GAP=.35, PAIR_GAP=2.1;

// раскладка слогов и времени
let lines=[];
function layout(){
  ctx.font=KFONT;
  let t=INTRO;
  LYRICS.forEach((src,i)=>{
    const row=ROWS[i%2];
    const syl=src.split('|').map(s=>{const [txt,d]=s.split(':');return{txt,d:+d}});
    let full='',x=row.x;
    syl.forEach(s=>{s.x=row.x+ctx.measureText(full).width;full+=s.txt;s.w=ctx.measureText(full).width+row.x-s.x;s.t0=t;t+=s.d;s.t1=t});
    lines.push({syl,row,start:syl[0].t0,end:t,pair:i>>1});
    t+=(i%2)?PAIR_GAP:GAP;
  });
  // окно показа пары: появляется до первой строки, уходит после второй
  for(const l of lines){
    const p=lines.filter(o=>o.pair===l.pair);
    l.show=p[0].start-.9;l.hide=p[p.length-1].end+.35;
  }
}
const LOOP=()=>lines[lines.length-1].hide+.8;

// частицы
const rnd=(a,b)=>a+Math.random()*(b-a);
const dust=Array.from({length:140},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,3.2),s:rnd(6,26),ph:rnd(0,6.3),z:rnd(.3,1)}));
const bokeh=Array.from({length:22},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(30,110),s:rnd(3,10),ph:rnd(0,6.3),hue:rnd(0,1)}));
const twinkles=Array.from({length:46},()=>({x:rnd(0,W),y:rnd(0,H*.95),sz:rnd(5,16),ph:rnd(0,6.3),sp:rnd(.6,1.6)}));
let bursts=[];

function star(x,y,r,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(a||0);ctx.beginPath();
  for(let i=0;i<8;i++){const rr=i%2?r*.22:r,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}
  ctx.closePath();ctx.fill();ctx.restore();
}

function background(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1d1448');g.addColorStop(.45,'#4b2a72');g.addColorStop(.78,'#a8507f');g.addColorStop(1,'#f0a37f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // мягкий свет справа, там встанут персонажи
  const cx=1450+Math.sin(t*.3)*20,cy=560;
  let rg=ctx.createRadialGradient(cx,cy,0,cx,cy,620);
  rg.addColorStop(0,'rgba(255,214,170,.42)');rg.addColorStop(.5,'rgba(255,170,200,.14)');rg.addColorStop(1,'rgba(255,170,200,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  // лучи
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(cx,-80);
  for(let i=0;i<7;i++){
    const a=-.55+i*.18+Math.sin(t*.25+i)*.04,al=.035+.025*Math.sin(t*.7+i*1.7);
    ctx.rotate(0);ctx.save();ctx.rotate(a);
    const lg=ctx.createLinearGradient(0,0,0,1300);lg.addColorStop(0,`rgba(255,230,200,${al*2})`);lg.addColorStop(1,'rgba(255,230,200,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.lineTo(90,1300);ctx.lineTo(-90,1300);ctx.fill();ctx.restore();
  }
  ctx.restore();
  // боке
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const b of bokeh){
    const y=((b.y-t*b.s)%(H+240)+H+240)%(H+240)-120,x=b.x+Math.sin(t*.2+b.ph)*30;
    const a=.05+.04*Math.sin(t*.5+b.ph);
    const bg=ctx.createRadialGradient(x,y,0,x,y,b.r);
    const c=b.hue<.5?'255,190,220':'255,225,170';
    bg.addColorStop(0,`rgba(${c},${a})`);bg.addColorStop(.7,`rgba(${c},${a*.6})`);bg.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,b.r,0,7);ctx.fill();
  }
  ctx.restore();
}

function particles(t,dt){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of dust){
    const y=((d.y-t*d.s)%(H+20)+H+20)%(H+20)-10,x=d.x+Math.sin(t*.4+d.ph)*24*d.z;
    const a=(.25+.35*Math.sin(t*1.3+d.ph*3))*d.z;
    ctx.fillStyle=`rgba(255,236,210,${Math.max(a,0)})`;ctx.beginPath();ctx.arc(x,y,d.r*d.z,0,7);ctx.fill();
  }
  for(const s of twinkles){
    const k=Math.max(0,Math.sin(t*s.sp*2+s.ph));const a=k*k*k;
    if(a<.02)continue;
    ctx.shadowColor='rgba(255,200,230,.9)';ctx.shadowBlur=14;
    ctx.fillStyle=`rgba(255,248,235,${a})`;star(s.x,s.y,s.sz*(.5+a*.6),t*.3+s.ph);
  }
  ctx.shadowBlur=0;
  bursts=bursts.filter(p=>(p.life-=dt)>0);
  for(const p of bursts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.vx*=.98;
    const a=Math.min(1,p.life/p.max*1.4);
    ctx.fillStyle=p.gold?`rgba(255,226,150,${a})`:`rgba(255,170,215,${a})`;
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;
    if(p.star)star(p.x,p.y,p.sz*a+2,p.rot+=dt*3);else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*.35*a+.6,0,7);ctx.fill()}
  }
  ctx.restore();
}
function emit(x,y,n,spread){
  for(let i=0;i<n;i++){const max=rnd(.5,1.3);bursts.push({x:x+rnd(-4,4),y:y+rnd(-spread,spread),vx:rnd(-40,80),vy:rnd(-110,-20),life:max,max,sz:rnd(4,11),star:Math.random()<.45,gold:Math.random()<.55,rot:rnd(0,6)})}
}

// титры
const CREDITS=[
  {txt:'Вокал: Fye (Onsa Media)',y:208},
  {txt:'Текст: Елизавета Чабан',y:262},
  {txt:'Композиторы: Jessie J & Moeki Harada',y:316},
];
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
function titles(t){
  ctx.save();ctx.textBaseline='alphabetic';
  // название по буквам
  const title='Together Till Infinity';
  ctx.font='700 76px Comfortaa';
  let x=86;
  for(let i=0;i<title.length;i++){
    const ch=title[i],k=ease((t-.15-i*.035)/.6);
    const w=ctx.measureText(ch).width;
    if(k>0){
      ctx.globalAlpha=k;
      const y=140+(1-k)*26;
      ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle='rgba(60,20,80,.55)';ctx.strokeText(ch,x,y);
      const g=ctx.createLinearGradient(0,y-62,0,y+8);g.addColorStop(0,'#fff6e6');g.addColorStop(1,'#ffc2dd');
      ctx.shadowColor='rgba(255,160,210,.85)';ctx.shadowBlur=22;ctx.fillStyle=g;ctx.fillText(ch,x,y);ctx.shadowBlur=0;
    }
    x+=w;
  }
  const kc=ease((t-1.1)/.7);
  ctx.globalAlpha=kc;ctx.font='700 34px Comfortaa';ctx.fillStyle='#ffe0ee';
  ctx.shadowColor='rgba(255,160,210,.7)';ctx.shadowBlur=12;ctx.fillText('(Russian Cover)',x+18-(1-kc)*20,140);
  // кредиты
  ctx.font='800 36px Nunito';
  CREDITS.forEach((c,i)=>{
    const k=ease((t-1.3-i*.18)/.7);if(k<=0)return;
    ctx.globalAlpha=k;const xx=92-(1-k)*40;
    ctx.shadowBlur=0;ctx.lineWidth=7;ctx.strokeStyle='rgba(45,18,70,.55)';ctx.strokeText(c.txt,xx,c.y);
    ctx.shadowColor='rgba(255,180,220,.55)';ctx.shadowBlur=10;ctx.fillStyle='#fbefff';ctx.fillText(c.txt,xx,c.y);
  });
  // тонкая линия под титрами
  const kl=ease((t-1.9)/.9);
  if(kl>0){ctx.globalAlpha=.8;ctx.shadowBlur=0;
    const lg=ctx.createLinearGradient(92,0,92+560,0);lg.addColorStop(0,'rgba(255,220,240,.9)');lg.addColorStop(1,'rgba(255,220,240,0)');
    ctx.fillStyle=lg;ctx.fillRect(92,350,560*kl,2.5);
    ctx.fillStyle='#fff3fa';ctx.shadowColor='#ffb6dc';ctx.shadowBlur=12;star(92+560*kl*.92,351,9*kl,t)}
  ctx.restore();
}

// караоке: сначала все обводки, потом заливки, чтобы слоги не перекрывали соседей
function sylPass(it,pass){
  const {s,y,frac,alpha,lift,scale,mode}=it;
  ctx.save();ctx.globalAlpha=alpha;
  const cx=s.x+s.w/2;
  ctx.translate(cx,y-lift);ctx.scale(scale,scale);ctx.translate(-cx,-y);
  ctx.lineJoin='round';ctx.lineWidth=12;
  if(pass===0){ctx.strokeStyle='rgba(42,20,72,.85)';ctx.strokeText(s.txt,s.x,y)}
  else if(pass===1){ctx.shadowColor='rgba(20,8,40,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;ctx.fillStyle='#fdf8ff';ctx.fillText(s.txt,s.x,y)}
  else if(frac>0){
    ctx.beginPath();ctx.rect(s.x-2,y-90,(s.w+4)*frac,130);ctx.clip();
    if(pass===2){ctx.strokeStyle='#4c1350';ctx.strokeText(s.txt,s.x,y)}
    else{
      const g=ctx.createLinearGradient(0,y-52,0,y+10);
      g.addColorStop(0,'#fff3c4');g.addColorStop(.45,'#ffc98a');g.addColorStop(1,'#ff7fbf');
      ctx.shadowColor='rgba(255,140,200,.95)';ctx.shadowBlur=mode==='active'?30:18;
      ctx.fillStyle=g;ctx.fillText(s.txt,s.x,y);
    }
  }
  ctx.restore();
}
function karaoke(t){
  ctx.font=KFONT;ctx.textBaseline='alphabetic';
  const items=[];
  for(const l of lines){
    if(t<l.show||t>l.hide+1)continue;
    const y=l.row.y;
    l.syl.forEach((s,j)=>{
      let alpha=ease((t-l.show-j*.04)/.45),lift=(1-alpha)*18,scale=1,frac=0,mode='idle';
      // уход: слоги поднимаются и тают
      const out=(t-l.hide-j*.035)/.6;
      if(out>0){alpha*=1-ease(out);lift+=ease(out)*30}
      if(t>=s.t1){frac=1;mode='done'}
      else if(t>=s.t0){
        frac=(t-s.t0)/(s.t1-s.t0);mode='active';
        const b=Math.sin(Math.min(1,frac*1.6)*Math.PI);lift+=b*10;scale=1+b*.07;
        if(Math.random()<.55)emit(s.x+s.w*frac,y-28,1,22);
      }
      if(alpha>.003)items.push({s,y,frac,alpha,lift,scale,mode});
      // вспышка на старте слога
      if(!s.fired&&t>=s.t0&&t<s.t0+.1){s.fired=true;emit(s.x+4,y-30,6,26)}
      if(t<s.t0)s.fired=false;
    });
  }
  for(let pass=0;pass<4;pass++)for(const it of items)sylPass(it,pass);
}

let t0=null,last=0;
function frame(now){
  if(t0===null)t0=now;
  let T=(now-t0)/1000;const dt=Math.min(.05,T-last);last=T;
  const L=LOOP();
  // титры остаются, караоке крутится по кругу
  const kt=T<L?T:INTRO-1+((T-L)%(L-INTRO+1));
  background(T);
  titles(T);
  karaoke(kt);
  particles(T,dt);
  requestAnimationFrame(frame);
}
document.getElementById('frame').onclick=()=>{t0=null;last=0;bursts=[]};
Promise.all([document.fonts.load(KFONT,'абвёAb'),document.fonts.load('700 76px Comfortaa','Ab'),document.fonts.load('800 36px Nunito','абвAb')]).then(()=>{layout();requestAnimationFrame(frame)});
</script>
</body>
</html>
